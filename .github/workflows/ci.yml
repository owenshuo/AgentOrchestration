name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/

  image-metadata-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: |
          docker build \
            --build-arg AO_BUILD_CONFIG=build-only-sentinel-4088 \
            -t agent-orchestrator:metadata-audit .
      - name: Audit runtime image metadata
        run: |
          python3 scripts/audit_image_metadata.py \
            agent-orchestrator:metadata-audit \
            --forbidden-value build-only-sentinel-4088
