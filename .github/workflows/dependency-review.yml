name: Dependency Review Exceptions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

jobs:
  dependency-exceptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate dependency exception manifest
        run: |
          python scripts/validate_dependency_exceptions.py \
            --overrides .github/dependency-review-overrides.json \
            --summary "$GITHUB_STEP_SUMMARY"
